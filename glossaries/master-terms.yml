version: 4
source_locale: en
domain: kitchen-knives
policy:
  - English is the source of truth.
  - Every deployed locale must provide every term marked enforce: true.
  - Approved target terms override generic machine-translation wording.
  - Longer source phrases take precedence over shorter overlapping phrases.
  - Ambiguous English words are constrained only in unambiguous technical phrases.
  - Knife-type names use the established technical form of each target language.
  - A new locale must not be activated until its technical vocabulary has been reviewed.

