      availability: Dit boek is gratis beschikbaar op GitHub. Opmerkingen, correcties en voorstellen voor verbetering zijn welkom.
      contact: Als GitHub niet vertrouwd is, kunt u ook rechtstreeks naar de auteur schrijven.
