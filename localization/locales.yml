export_formats:
  - markdown
  - html
  - pdf
  - docx

rules:
  - English is the sole source of truth.
  - Meaning changes must be made in English first.
  - A non-English locale is published automatically only when every translated page is complete, current and structurally valid.
  - GitHub prepares a deterministic queue containing only missing or changed tx-unit blocks.
  - ChatGPT or Codex translates that queue using the user's ChatGPT plan; the repository makes no model API calls.
  - Incomplete locales never block already complete languages; they are skipped until they become publication-ready.
  - Publication never translates on the fly and never falls back to the legacy Marian/OPUS-MT engine.
  - Unchanged tx-unit blocks are reused exactly, including human corrections.
  - No OPENAI_API_KEY or API billing is required anywhere in the repository workflow.
  - Every committed translated page displays a visible review notice.
  - Machine-updated translations require human review, especially Simplified Chinese specialist terminology.
  - CJK PDF exports require fonts with full Unicode coverage.
  - Left-to-right configured locales may publish automatically when complete; right-to-left locales remain opt-out until the RTL publication path is explicitly enabled.
