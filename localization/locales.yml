  zh-Hans:
    name: 简体中文
    publish_when_complete: true
    status: committed
    direction: ltr
    deploy: true
    mkdocs_language: zh
    specialist_review_required: true
    translation_guidance: >-
      Write natural professional Simplified Chinese for readers of technical culinary
