source_locale: en
locale_standard: BCP-47
translation_engine: ChatGPT-assisted differential tx-unit translation memory; GitHub performs no model API calls
translation_policy: translations are derived from and never replace the English source of truth

locales:
  en:
    name: English
    publish_when_complete: true
    status: source
    direction: ltr
    deploy: true
    mkdocs_language: en
  it:
    name: Italiano
    publish_when_complete: true
    status: committed
    direction: ltr
    deploy: true
    mkdocs_language: it
    translation_guidance: >-
      Write polished native Italian editorial prose, not translated-sounding Italian.
      Prefer terminology actually used in Italian professional cooking, cutlery,
      sharpening and metallurgy. Avoid English syntactic calques, unnecessary
      anglicisms and literal renderings when an established Italian expression exists.
    translation_rules:
      - id: damascus-vs-damascato
        source_triggers:
          - Damascus
          - pattern-welded
          - patterned cladding
          - surface-decorated
          - laser
        instruction: >-
          Italian terminology rule: "Damasco" and "damascato" are not interchangeable.
          Use "acciaio Damasco", "rivestimento in acciaio Damasco", "lama in acciaio
          Damasco" and equivalent Damasco wording for genuine layered or pattern-welded
          constructions. Reserve "acciaio damascato" (or explicit "damascato
          superficialmente") for a monosteel blade whose Damascus-like pattern is only
          applied to the surface, for example by laser engraving, printing, coating or
          shallow decorative etching. Never describe genuine layered Damascus as
          "rivestimento damascato", "motivo damascato", "lama damascata" or "famiglia
          damascata".
        forbidden_target_patterns:
          - '\brivestiment(?:o|i)\s+damascat(?:o|i)\b'
          - '\bmotiv(?:o|i)\s+damascat(?:o|i)\b'
          - '\blam(?:a|e)\s+damascat(?:a|e)\b'
          - '\bfamigli(?:a|e)\s+damascat(?:a|e)\b'
  es:
    name: Español
    publish_when_complete: true
    status: inactive
    direction: ltr
    deploy: false
    mkdocs_language: es
  de:
    name: Deutsch
    publish_when_complete: true
    status: inactive
    direction: ltr
    deploy: false
    mkdocs_language: de
  fr:
    name: Français
    publish_when_complete: true
    status: inactive
    direction: ltr
    deploy: false
    mkdocs_language: fr
  ja:
    name: 日本語
    publish_when_complete: true
    status: inactive
    direction: ltr
