name: Translate book with OpenAI

on:
  pull_request:
    paths:
      - "content/en/**"
      - "glossaries/**"
      - "localization/locales.yml"
      - "scripts/openai_translate.py"
      - "scripts/test_openai_translate.py"
      - "requirements-translation.txt"
      - ".github/workflows/translate-openai.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch/ref to translate"
        required: true
        default: "main"
      force_full:
        description: "Retranslate all units instead of reusing tx-unit memory"
        type: boolean
        required: true
        default: false
      locales:
        description: "Optional space-separated locale codes; blank means all deployed non-English locales"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openai-translation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  translate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out source branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-translation.txt

      - name: Install translation dependencies
        run: pip install -r requirements-translation.txt

      - name: Run differential translation regression tests
        run: python scripts/test_openai_translate.py

      - name: Create manual translation branch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          branch="translations/openai-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          echo "TRANSLATION_BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Centralize English bibliography before translation
        run: python scripts/centralize_bibliography.py

      - name: Translate changed units and independently review them
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL || 'gpt-6-sol' }}
          OPENAI_TRANSLATION_REVIEW_MODEL: ${{ vars.OPENAI_TRANSLATION_REVIEW_MODEL || 'gpt-6-astra' }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full || false }}
          TARGET_LOCALES: ${{ github.event_name == 'workflow_dispatch' && inputs.locales || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$FORCE_FULL" = "true" ]; then
            args+=(--force-full)
          fi
          if [ -n "$TARGET_LOCALES" ]; then
            read -r -a locale_args <<< "$TARGET_LOCALES"
            args+=(--locales "${locale_args[@]}")
          fi
          python scripts/openai_translate.py "${args[@]}"

      - name: Validate OpenAI translation memory and degeneration guards
        run: python scripts/openai_translate.py --check-only

      - name: Commit translation refresh
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/en/bibliography.md translations

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes were required."
            exit 0
          fi

          git commit -m "Refresh reviewed OpenAI translations"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push refreshed translations into current PR
        if: github.event_name == 'pull_request' && steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Push manual translation branch
        if: github.event_name == 'workflow_dispatch' && steps.commit.outputs.changed == 'true'
        run: git push --set-upstream origin "$TRANSLATION_BRANCH"

      - name: Open manual translation pull request
        if: github.event_name == 'workflow_dispatch' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base "${{ inputs.ref }}" \
            --head "$TRANSLATION_BRANCH" \
            --title "Refresh book translations with OpenAI" \
            --body "Differential translation refresh using the OpenAI Responses API. Changed English tx-units were translated with the configured translation model and independently reviewed with the configured review model. Unchanged tx-units were reused from committed translation memory."

  external-pr-note:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Translation is intentionally not executed for fork pull requests because repository secrets are unavailable."
          echo "A maintainer can run the manual OpenAI translation workflow after bringing the source changes into a trusted branch."
