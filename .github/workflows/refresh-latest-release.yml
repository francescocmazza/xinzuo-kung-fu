name: Refresh latest release after Pages deployment

on:
  workflow_run:
    workflows:
      - Deploy The Kung Fu of Xinzuo to GitHub Pages
    types:
      - completed
  # Pushes that change this workflow on main intentionally trigger a full rolling-release rebuild.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-latest-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-xinzuo-kung-fu-release
  cancel-in-progress: true

jobs:
  refresh-release:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the fully refreshed main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pdf.txt

      - name: Install documentation and PDF dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install Playwright Chromium and CJK fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra

      - name: Validate the multilingual source
        run: python scripts/multilingual_site.py --require-translations

      - name: Export current PDFs
        run: |
          python scripts/export_pdf_guides.py \
            --locales all \
            --placeholders hide \
            --output-dir release-assets/pdf

      - name: Package current downloadable editions
        run: |
          set -euo pipefail
          mkdir -p release-assets/packages/html release-assets/packages/markdown release-upload
          cp -R site/. release-assets/packages/html/
          cp -R .site-work/docs/. release-assets/packages/markdown/
          cp release-assets/pdf/*.pdf release-upload/
          (cd release-assets/packages/html && zip -qr ../../../release-upload/xinzuo-kung-fu-latest-html.zip .)
          (cd release-assets/packages/markdown && zip -qr ../../../release-upload/xinzuo-kung-fu-latest-markdown.zip .)
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - name: Create or refresh the rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="latest"
          title="The Kung Fu of Xinzuo — Latest Edition"
          source_sha="$(git rev-parse HEAD)"
          notes="Automatically rebuilt from the current main branch. Source commit: ${source_sha}."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$tag" "$source_sha"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset_id; do
              gh api \
                --method DELETE \
                "repos/${REPOSITORY}/releases/assets/${asset_id}"
            done < <(
              gh api \
                "repos/${REPOSITORY}/releases/tags/${tag}" \
                --jq '.assets[] | select(.name | test("\\.(pdf|zip)$")) | .id'
            )
            gh release upload "$tag" release-upload/* --clobber --repo "$REPOSITORY"
            gh release edit "$tag" \
              --repo "$REPOSITORY" \
              --target "$source_sha" \
              --title "$title" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" release-upload/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi

      - name: Verify downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset_count="$(gh release view latest --repo "$REPOSITORY" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 6 ]; then
            echo "Expected exactly 6 downloadable assets, found $asset_count." >&2
            exit 1
          fi
          version_label="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().version_label)')"
          gh release view latest --repo "$REPOSITORY" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          printf '%s\n' \
            "Il-Kung-Fu-di-Xinzuo-IT-${version_label}.pdf" \
            "SHA256SUMS.txt" \
            "The-Kung-Fu-of-Xinzuo-EN-${version_label}.pdf" \
            "Xinzuo-Kung-Fu-ZH-HANS-${version_label}.pdf" \
            "xinzuo-kung-fu-latest-html.zip" \
            "xinzuo-kung-fu-latest-markdown.zip" | sort > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          gh release view latest --repo "$REPOSITORY" --json url --jq '.url'
