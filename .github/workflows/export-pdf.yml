name: Export PDF guides

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Locale code to export, or 'all' for every publication-ready language"
        type: string
        default: all
      placeholders:
        description: "Editorial IMAGE PLACEHOLDER boxes in the printed guide"
        type: choice
        default: hide
        options:
          - hide
          - show
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "content/en/**/*.md"
      - "content/en/assets/**"
      - "translations/**"
      - "mkdocs.yml"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/chatgpt_translate.py"
      - "scripts/test_chatgpt_translate.py"
      - "scripts/centralize_bibliography.py"
      - "scripts/publication_metadata.py"
      - "scripts/publication_locales.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "requirements-pdf.txt"
      - "requirements-translation.txt"
      - ".github/workflows/export-pdf.yml"

permissions:
  contents: read

concurrency:
  group: export-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation and PDF export dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install fonts for CJK coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra

      - name: Centralize bibliography in English source
        run: python scripts/centralize_bibliography.py

      - name: Validate translation tooling and resolve ready languages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_chatgpt_translate.py
          python scripts/test_publication_locales.py
          python scripts/publication_locales.py --explain

      - name: Apply A5 publication profile
        run: python scripts/pdf_export/apply_a5_profile.py

      - name: Smoke-test the English PDF on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/export_pdf_guides.py \
            --locales en \
            --placeholders hide \
            --output-dir pdf-export

      - name: Export requested PDF guide(s)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/export_pdf_guides.py \
            --locales ${{ inputs.language }} \
            --placeholders ${{ inputs.placeholders }} \
            --output-dir pdf-export

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: xinzuo-kung-fu-pdf-${{ github.run_number }}
          path: pdf-export
          if-no-files-found: error
          retention-days: 1
