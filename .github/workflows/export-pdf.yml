name: Export PDF guides

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Locale code to export, or 'all' for every publication-ready language"
        type: string
        default: all
      placeholders:
        description: "Editorial IMAGE PLACEHOLDER boxes in the printed guide"
        type: choice
        default: hide
        options:
          - hide
          - show
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "content/en/**/*.md"
      - "content/en/assets/**"
      - "translations/**"
      - "mkdocs.yml"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/chatgpt_translate.py"
      - "scripts/test_chatgpt_translate.py"
      - "scripts/centralize_bibliography.py"
      - "scripts/publication_metadata.py"
      - "scripts/publication_locales.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "requirements-pdf.txt"
      - "requirements-translation.txt"
      - ".github/workflows/export-pdf.yml"

permissions:
  contents: read

concurrency:
  group: export-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation and PDF export dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install publication fonts and CJK coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra fonts-urw-base35

      - name: Centralize bibliography in English source
        run: python scripts/centralize_bibliography.py

      - name: Validate translation tooling and resolve ready languages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_chatgpt_translate.py
          python scripts/test_publication_locales.py
          python scripts/publication_locales.py --explain

      - name: Validate localized back-cover parsing
        run: python scripts/pdf_export/test_back_cover.py

      - name: Verify publication cover assets
        shell: bash
        run: |
          set -euo pipefail
          test -s content/en/assets/Copertina.jpg
          test -s 'content/en/assets/ChatGPT Image Sep 24, 2026, 07_22_10 PM (1).png'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          expected = {
              "content/en/assets/Copertina.jpg": (
                  "dcb33de784b5401d13c6f7323d5842fd5db5112b2fb763893021aba253bf3a76",
                  (3496, 4961),
                  "JPEG",
              ),
              "content/en/assets/ChatGPT Image Sep 24, 2026, 07_22_10 PM (1).png": (
                  "abd838db6df8e77ec931986d3426b9eafd011f09ee260052e006d72db91441fb",
                  (1055, 1491),
                  "PNG",
              ),
          }
          for filename, (digest, dimensions, expected_format) in expected.items():
              path = Path(filename)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"{filename}: SHA256 mismatch: {actual}")
              with Image.open(path) as image:
                  if image.format != expected_format or image.size != dimensions:
                      raise SystemExit(
                          f"{filename}: expected {expected_format} {dimensions}, "
                          f"got {image.format} {image.size}"
                      )
                  image.verify()
          print("Final uploaded cover assets verified")
          PY

      - name: Apply A5 publication profile
        run: python scripts/pdf_export/apply_a5_profile.py

      - name: Smoke-test the English PDF on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/export_pdf_guides.py \
            --locales en it \
            --placeholders hide \
            --output-dir pdf-export

      - name: Export requested PDF guide(s)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/export_pdf_guides.py \
            --locales ${{ inputs.language }} \
            --placeholders ${{ inputs.placeholders }} \
            --output-dir pdf-export

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: xinzuo-kung-fu-pdf-${{ github.run_number }}
          path: pdf-export
          if-no-files-found: error
          retention-days: 1
