name: Export PDF guides

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language to export ('all' builds one PDF per active language)"
        type: choice
        default: all
        options:
          - all
          - en
          - it
          - zh-Hans
      placeholders:
        description: "Editorial IMAGE PLACEHOLDER boxes in the printed guide"
        type: choice
        default: hide
        options:
          - hide
          - show
  pull_request:
    paths:
      - "content/en/**/*.md"
      - "content/en/assets/**"
      - "translations/**"
      - "mkdocs.yml"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/auto_translate.py"
      - "scripts/centralize_bibliography.py"
      - "scripts/publication_metadata.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "requirements-pdf.txt"
      - "requirements-translation.txt"
      - ".github/workflows/export-pdf.yml"

permissions:
  contents: read

concurrency:
  group: export-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation and PDF export dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install fonts for CJK coverage
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra

      - name: Centralize bibliography in English source
        run: python scripts/centralize_bibliography.py

      - name: Install local translation dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.language != 'en'
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -r requirements-translation.txt

      - name: Refresh stale active translations locally
        if: github.event_name == 'workflow_dispatch' && inputs.language != 'en'
        run: python scripts/auto_translate.py

      - name: Apply A5 publication profile
        run: python scripts/pdf_export/apply_a5_profile.py

      - name: Smoke-test the English PDF on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python scripts/export_pdf_guides.py \
            --locales en \
            --placeholders hide \
            --output-dir pdf-export

      - name: Export requested PDF guide(s)
        if: github.event_name == 'workflow_dispatch'
        run: |
          python scripts/export_pdf_guides.py \
            --locales ${{ inputs.language }} \
            --placeholders ${{ inputs.placeholders }} \
            --output-dir pdf-export

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: xinzuo-kung-fu-pdf-${{ github.run_number }}
          path: pdf-export
          if-no-files-found: error
          retention-days: 1
