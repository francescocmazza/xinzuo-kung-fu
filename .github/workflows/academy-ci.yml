name: Validate Xinzuo Academy

on:
  pull_request:
    paths:
      - "academy/**"
      - "academy-backend/**"
      - "scripts/validate_academy.py"
      - ".github/workflows/academy-ci.yml"
      - ".github/workflows/academy-pages.yml"
      - ".github/workflows/academy-backend-deploy.yml"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - "academy/**"
    paths:
      - "academy/**"
      - "academy-backend/**"
      - "scripts/validate_academy.py"
      - ".github/workflows/academy-ci.yml"
      - ".github/workflows/academy-pages.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate curriculum and question bank
        run: python scripts/validate_academy.py

      - name: Check Academy JavaScript syntax
        run: |
          node --check academy/app.js
          node --check academy/account.js
          node --check academy/legal.js
          node --check academy/certificate.js
          node --check academy-backend/src/certification-bank.js
          node --check academy-backend/src/worker.js

      - name: Validate D1 migration SQL
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          for migration in sorted(Path("academy-backend/migrations").glob("*.sql")):
              print("Applying", migration.name)
              db.executescript(migration.read_text(encoding="utf-8"))
          tables = {row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          required = {
              "users","sessions","invites","learner_progress","activity_events","password_reset_tokens",
              "verification_challenges","registration_rate_limits","consent_events","certificates","certificate_events","certification_attempts"
          }
          missing = required - tables
          if missing:
              raise SystemExit(f"Missing D1 tables: {sorted(missing)}")
          print("D1 schema OK:", ", ".join(sorted(required)))
          PY

      - name: Verify required web assets
        shell: bash
        run: |
          set -euo pipefail
          test -s academy/index.html
          test -s academy/styles.css
          test -s academy/app.js
          test -s academy/account.js
          test -s academy/config.js
          test -s academy/privacy.html
          test -s academy/terms.html
          test -s academy/legal.js
          test -s academy/certificate.html
          test -s academy/certificate.js
          test -s academy-backend/src/worker.js
          test -s academy-backend/src/certification-bank.js
          test -s academy-backend/migrations/0001_initial.sql
          test -s academy-backend/migrations/0002_public_registration_certificates.sql
          test -s academy-backend/migrations/0003_whatsapp_otp.sql
          test -s academy-backend/migrations/0004_email_only_auth.sql
          test -s academy/data/course.en.json
          test -s academy/data/course.it.json

      - name: Verify public Academy contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/auth/register/start' academy-backend/src/worker.js
          grep -q '/api/auth/register/verify' academy-backend/src/worker.js
          grep -q '/api/certification/base/start' academy-backend/src/worker.js
          grep -q '/api/certification/base/submit' academy-backend/src/worker.js
          grep -q 'certificates.*verify' academy-backend/src/worker.js
          grep -q 'marketingEmailConsent' academy/index.html
          grep -q 'name="email".*required' academy/index.html
          grep -q 'name="phone".*required' academy/index.html
          grep -q 'RESEND_API_KEY' academy-backend/src/worker.js
          if grep -qi 'WhatsApp' academy/index.html academy/account.js academy-backend/src/worker.js .github/workflows/academy-backend-deploy.yml; then
            echo "WhatsApp runtime references must not remain in email-only auth mode." >&2
            exit 1
          fi
          grep -q 'marketingPhoneConsent' academy/index.html
          grep -q 'privacy.html' academy/index.html
          grep -q 'terms.html' academy/index.html
          grep -q 'PUBLIC_REGISTRATION_ENABLED' academy-backend/src/worker.js
