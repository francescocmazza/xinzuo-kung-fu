name: Editorial carbon image transfer
on:
  push:
    branches: [editorial/revision-51-review]
    paths: [.github/workflows/editorial-carbon-image-transfer.yml]
permissions:
  contents: write
jobs:
  integrate-approved-figure:
    if: github.repository == 'francescocmazza/xinzuo-kung-fu' && github.ref == 'refs/heads/editorial/revision-51-review'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and source validation dependencies
        run: python -m pip install --disable-pip-version-check Pillow PyYAML
      - name: Restore exact verified image transfer bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, urllib.request
          from PIL import Image
          sha = 'aeb82352a600513efcaee30f6aa9c0ddc65a3672'
          url = 'https://api.github.com/repos/francescocmazza/xinzuo-kung-fu/git/blobs/' + sha
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              obj = json.load(response)
          raw = base64.b64decode(obj['content'])
          actual = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert actual == sha, (actual, sha)
          encoded = base64.b64encode(raw).decode('ascii')
          # Remove duplicated base64 runs introduced during connector transfer.
          # Every splice is checked, then the complete original checksum is checked.
          splices = [(369,391,'3ytrfK2t8ra3ytrfK2t8ra'), (440,451,'bZEptkSm2RK'),
                     (556,567,'KbZEptkSm2R'), (592,603,'rfK2t8ra3yt'),
                     (734,745,'lNsiU2yJTbI'), (826,837,'bIlNsiU2yJT'),
                     (999,1010,'rfK2t8ra3yt'), (1131,1142,'2yJTbIlNsiU'),
                     (12411,12422,'bZEptkSm2RK'), (12431,12442,'fK2t8ra3ytr')]
          for start, end, expected in reversed(splices):
              assert encoded[start:end] == expected, (start, end)
              encoded = encoded[:start] + encoded[end:]
          encoded += 'A'
          raw = base64.b64decode(encoded, validate=True)
          expected_sha256 = 'a924d8fde025309ef862d1f9aee7b96f9f642b19c88c5e80f70d1e2e06778369'
          assert hashlib.sha256(raw).hexdigest() == expected_sha256
          assert len(raw) == 31110
          with Image.open(io.BytesIO(raw)) as image:
              image.load()
              assert image.size == (1200,900)
          path = pathlib.Path('content/en/assets/images/approved/iron-carbon-interstitial-matrix.webp')
          assert not path.exists(), 'Do not overwrite an existing approved illustration'
          path.write_bytes(raw)
          print('VERIFIED_IMAGE_SHA256', expected_sha256)
          PY
      - name: Insert source and localized captions
        run: python scripts/editorial_carbon_figure_once.py
      - name: Validate new figure in all active languages
        run: |
          python scripts/test_repair_translated_html.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from check_images import check_file
          from multilingual_site import translation_status, GLOSSARY
          rel = Path('02-steels-and-metallurgy/alloying-elements.md')
          source = (Path('content/en') / rel).read_text(encoding='utf-8')
          for lang in ('it','zh-Hans'):
              assert translation_status(lang, rel, source, GLOSSARY.read_text())[0] == 'current', lang
          problems = []
          for base in ('content/en', 'translations/it', 'translations/zh-Hans'):
              md = Path(base).resolve() / rel
              text = md.read_text(encoding='utf-8')
              assert text.count('VIS-MET-CARBON-INTERSTITIAL-01') == 1
              check_file(md, '../../assets/images/approved/iron-carbon-interstitial-matrix.webp', problems)
          assert not problems, problems
          print('New figure: image decoding, links, unique placement and localized source hashes PASS in EN/IT/ZH-Hans')
          PY
          git diff --check
      - name: Commit only the requested figure changes and remove one-time helpers
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/editorial/revision-51-review'
          REMOTE_HEAD="$(git ls-remote origin refs/heads/editorial/revision-51-review | cut -f1)"
          test "$REMOTE_HEAD" = "$EXPECTED_HEAD"
          git rm .github/workflows/editorial-carbon-image-transfer.yml scripts/editorial_carbon_figure_once.py
          git add content/en/02-steels-and-metallurgy/alloying-elements.md translations/it/02-steels-and-metallurgy/alloying-elements.md translations/zh-Hans/02-steels-and-metallurgy/alloying-elements.md content/en/assets/IMAGE_RIGHTS.md content/en/assets/images/approved/iron-carbon-interstitial-matrix.webp
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add approved text-free carbon matrix figure with translatable captions'
          git push origin HEAD:refs/heads/editorial/revision-51-review
          echo "INTEGRATION_COMMIT=$(git rev-parse HEAD)"
