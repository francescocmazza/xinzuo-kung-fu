name: Deploy The Kung Fu of Xinzuo to GitHub Pages

on:
  pull_request:
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/auto_translate.py"
      - "scripts/repair_translated_html.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-translation.txt"
      - ".github/workflows/pages.yml"
      - ".github/workflows/refresh-latest-release.yml"
  push:
    branches:
      - main
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/auto_translate.py"
      - "scripts/repair_translated_html.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-translation.txt"
      - ".github/workflows/pages.yml"
      - ".github/workflows/refresh-latest-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# A corrected PR supersedes its older validation run, but main publications are
# never cancelled halfway through. This prevents partial deploys and red noise.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-translation.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Cache local translation models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-marian-${{ runner.os }}-${{ hashFiles('requirements-translation.txt') }}
          restore-keys: |
            hf-marian-${{ runner.os }}-

      - name: Install local translation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -r requirements-translation.txt

      - name: Refresh stale active translations locally
        env:
          TRANSLATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/auto_translate.py

      - name: Repair translated raw HTML
        run: python scripts/repair_translated_html.py

      - name: Commit refreshed translations to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_translations() {
            if git diff --quiet -- translations; then
              echo "No translation files changed."
              return 0
            fi
            git add translations
            git commit -m "Auto-refresh translations [skip ci]"
            git push origin HEAD:main
          }

          if push_translations; then
            exit 0
          fi

          # If main advanced while translation was running, regenerate from the
          # newest main instead of failing with a non-fast-forward push.
          for attempt in 2 3; do
            echo "Main advanced during translation; regenerating from current main (attempt ${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main
            python scripts/auto_translate.py
            python scripts/repair_translated_html.py

            if git diff --quiet -- translations; then
              echo "Translations are already current on the latest main."
              exit 0
            fi

            git add translations
            git commit -m "Auto-refresh translations [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
          done

          echo "Main changed repeatedly while translations were being committed." >&2
          exit 1

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Validate complete multilingual source on pull requests
        if: github.event_name == 'pull_request'
        run: python scripts/multilingual_site.py --require-translations

      - name: Build every configured language from refreshed translations
        if: github.event_name != 'pull_request'
        run: python scripts/multilingual_site.py --require-translations

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
