name: Publish book, PDFs and GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/chatgpt_translate.py"
      - "scripts/test_chatgpt_translate.py"
      - "scripts/centralize_bibliography.py"
      - "scripts/publication_metadata.py"
      - "scripts/publication_locales.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-pdf.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-the-gongfu-of-xinzuo-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve sequential publication revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          legacy_complete_count="$(python -c 'from scripts.publication_metadata import LEGACY_COMPLETE_REVISION_COUNT; print(LEGACY_COMPLETE_REVISION_COUNT)')"
          highest_revision=0

          # Historical vXYZ releases have already been audited once and are
          # represented by LEGACY_COMPLETE_REVISION_COUNT. From the new system
          # onward, a revision is complete when its own SHA256 manifest exactly
          # matches the uploaded assets and the canonical EN/HTML/Markdown files exist.
          # The number of language PDFs is intentionally dynamic.
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^revision-([0-9]+)$ ]]; then
              revision=$((10#${BASH_REMATCH[1]}))
              if (( revision > highest_revision )); then
                highest_revision="$revision"
              fi
            fi
          done < <(
            gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name'
          )

          echo "Audited complete historical publications: ${legacy_complete_count}"

          if (( highest_revision == 0 )); then
            publication_revision=$((legacy_complete_count + 1))
            echo "No new-style revision exists yet; next complete publication is Revision ${publication_revision}."
          else
            revision_slug="Revision-${highest_revision}"
            tag="revision-${highest_revision}"
            asset_dir="$(mktemp -d)"
            gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | sort > current-revision-assets.txt

            previous_complete=false
            if gh release download "$tag" --repo "$REPOSITORY" --pattern "SHA256SUMS.txt" --dir "$asset_dir" >/dev/null 2>&1; then
              awk '{print $2}' "$asset_dir/SHA256SUMS.txt" | sed 's/^\*//' | sort > manifest-assets.txt
              printf '%s\n' "SHA256SUMS.txt" >> manifest-assets.txt
              sort -u manifest-assets.txt -o manifest-assets.txt
              if diff -q manifest-assets.txt current-revision-assets.txt >/dev/null 2>&1 \
                 && grep -q "^The-Gongfu-of-Xinzuo-EN-${revision_slug}\.pdf$" current-revision-assets.txt \
                 && grep -q "^the-gongfu-of-xinzuo-${revision_slug}-html\.zip$" current-revision-assets.txt \
                 && grep -q "^the-gongfu-of-xinzuo-${revision_slug}-markdown\.zip$" current-revision-assets.txt; then
                previous_complete=true
              fi
            fi
            rm -rf "$asset_dir"

            if [ "$previous_complete" = "true" ]; then
              publication_revision=$((highest_revision + 1))
              echo "Latest complete publication is Revision ${highest_revision}; next is Revision ${publication_revision}."
            else
              publication_revision="$highest_revision"
              echo "Revision ${highest_revision} is incomplete; reusing Revision ${publication_revision}."
            fi
          fi

          echo "PUBLICATION_REVISION=${publication_revision}" >> "$GITHUB_ENV"
          echo "Publication revision locked to Revision ${publication_revision} for this entire workflow run."

      - name: Install documentation and PDF dependencies
        run: pip install -r requirements-pdf.txt

      - name: Validate Xinzuo Academy
        run: python scripts/validate_academy.py

      - name: Resolve publication-ready languages
        shell: bash
        run: |
          set -euo pipefail
          ready_locales="$(python scripts/publication_locales.py --format space)"
          if [ -z "$ready_locales" ]; then
            echo "No publication-ready locales were resolved." >&2
            exit 1
          fi
          echo "READY_LOCALES=$ready_locales" >> "$GITHUB_ENV"
          echo "Publication-ready locales: $ready_locales"
          python scripts/publication_locales.py --explain


      - name: Verify English bibliography is already centralized
        shell: bash
        run: |
          set -euo pipefail
          python scripts/centralize_bibliography.py
          if ! git diff --quiet -- content/en; then
            echo "English source changed during publication normalization. Run the ChatGPT translation workflow and merge its PR before publishing." >&2
            git diff -- content/en
            exit 1
          fi

      - name: Validate committed ChatGPT translations for ready languages
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_chatgpt_translate.py
          python scripts/test_publication_locales.py
          non_english=""
          for locale in $READY_LOCALES; do
            if [ "$locale" != "en" ]; then
              non_english="$non_english $locale"
            fi
          done
          if [ -n "${non_english// /}" ]; then
            python scripts/chatgpt_translate.py --check-only --locales $non_english
          fi

      - name: Build publication-ready languages
        run: python scripts/multilingual_site.py --require-translations --locales $READY_LOCALES

      - name: Add Xinzuo Academy to the published site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/academy
          cp academy/index.html academy/styles.css academy/app.js site/academy/
          cp -R academy/data site/academy/data

      - name: Install Playwright Chromium and CJK fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra fonts-urw-base35

      - name: Validate localized back-cover parsing
        run: python scripts/pdf_export/test_back_cover.py

      - name: Verify publication cover assets
        shell: bash
        run: |
          set -euo pipefail
          test -s content/en/assets/CoverFront.png
          test -s content/en/assets/CoverBack.png
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          expected = {
              "content/en/assets/CoverFront.png": ("a3ca06e7c3569fc27b255c1e10a1c3efc76de5bc7441390be46050753b6d04a8", (1055, 1491)),
              "content/en/assets/CoverBack.png": ("6f5ca97c709f970e8ccc6fcad6d54355ce69f975141c53ec055bc84a3aab20e0", (1055, 1491)),
          }
          for filename, (digest, dimensions) in expected.items():
              path = Path(filename)
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"{filename}: SHA256 mismatch: {actual}")
              with Image.open(path) as image:
                  if image.format != "PNG" or image.size != dimensions:
                      raise SystemExit(f"{filename}: expected approved PNG {dimensions}, got {image.format} {image.size}")
                  image.verify()
          print("Approved cover assets verified")
          PY

      - name: Apply A5 publication profile
        run: python scripts/pdf_export/apply_a5_profile.py

      - name: Export current PDFs
        run: |
          python scripts/export_pdf_guides.py \
            --locales $READY_LOCALES \
            --placeholders hide \
            --output-dir release-assets/pdf

      - name: Package current downloadable revision
        run: |
          set -euo pipefail
          revision_slug="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().revision_slug)')"
          mkdir -p release-assets/packages/html release-assets/packages/markdown release-upload
          cp -R site/. release-assets/packages/html/
          cp -R .site-work/docs/. release-assets/packages/markdown/

          # Keep reader-facing metadata as "Revision N", but use filesystem-safe
          # Revision-N names for uploaded assets so GitHub never rewrites spaces.
          for pdf in release-assets/pdf/*.pdf; do
            name="$(basename "$pdf")"
            safe_name="${name/Revision /Revision-}"
            cp "$pdf" "release-upload/${safe_name}"
          done

          (cd release-assets/packages/html && zip -qr "../../../release-upload/the-gongfu-of-xinzuo-${revision_slug}-html.zip" .)
          (cd release-assets/packages/markdown && zip -qr "../../../release-upload/the-gongfu-of-xinzuo-${revision_slug}-markdown.zip" .)
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - name: Publish immutable numbered revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          revision="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().revision)')"
          revision_label="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().revision_label)')"
          publication_date="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().publication_date)')"
          tag="revision-${revision}"
          title="The Gongfu of Xinzuo — ${revision_label} — ${publication_date}"
          source_sha="$(git rev-parse HEAD)"
          notes="${revision_label}. Automatically published from main on ${publication_date}. Languages: ${READY_LOCALES}. Source commit: ${source_sha}. Revision numbers count complete published editions only; commits and failed publication attempts do not consume a revision number."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "$tag" "$source_sha"
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "${revision_label} already exists but is incomplete; refreshing its assets idempotently."
            while IFS= read -r asset_id; do
              gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${asset_id}"
            done < <(gh api "repos/${REPOSITORY}/releases/tags/${tag}" --jq '.assets[].id')
            gh release upload "$tag" release-upload/* --repo "$REPOSITORY"
            gh release edit "$tag" \
              --repo "$REPOSITORY" \
              --target "$source_sha" \
              --title "$title" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" release-upload/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi

          if gh release view latest --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest \
              --repo "$REPOSITORY" \
              --title "Legacy rolling edition — archived" \
              --notes "Legacy rolling release retained for continuity. New publications use sequential Revision numbers based only on complete published editions."
          fi

      - name: Verify downloadable revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          revision="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().revision)')"
          revision_label="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().revision_label)')"
          revision_slug="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().revision_slug)')"
          tag="revision-${revision}"
          gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          python scripts/publication_locales.py --expected-assets "$revision_slug" | sort > expected-assets.txt
          expected_count="$(wc -l < expected-assets.txt | tr -d ' ')"
          asset_count="$(wc -l < actual-assets.txt | tr -d ' ')"
          if [ "$asset_count" -ne "$expected_count" ]; then
            echo "Expected $expected_count downloadable assets for ${revision_label}, found $asset_count." >&2
            exit 1
          fi
          diff -u expected-assets.txt actual-assets.txt

          latest_tag="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$latest_tag" != "$tag" ]; then
            echo "Expected GitHub's Latest release to be ${tag}, found ${latest_tag}." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
