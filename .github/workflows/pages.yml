name: Publish book, PDFs and GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/**"
      - "scripts/multilingual_site.py"
      - "scripts/auto_translate.py"
      - "scripts/repair_translated_html.py"
      - "scripts/centralize_bibliography.py"
      - "scripts/publication_metadata.py"
      - "scripts/export_pdf_guides.py"
      - "scripts/pdf_export/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "requirements-pdf.txt"
      - "requirements-translation.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-the-gongfu-of-xinzuo-main
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install documentation and PDF dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install local translation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -r requirements-translation.txt

      - name: Centralize bibliography in English source
        run: python scripts/centralize_bibliography.py

      - name: Resolve translation base revision
        id: translation-base
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"

          # A CI/recovery-only commit may follow a source-changing commit whose
          # publication failed before refreshed translations were committed. If
          # HEAD itself changes no English source or glossary, walk back to the
          # most recent source-changing commit and use that commit's parent. This
          # prevents stale translations from merely receiving a new source hash.
          if git diff --quiet "$base" HEAD -- content/en glossaries; then
            cursor="$base"
            for _ in $(seq 1 50); do
              parent="$(git rev-parse "${cursor}^1" 2>/dev/null || true)"
              if [ -z "$parent" ]; then
                break
              fi
              if ! git diff --quiet "$parent" "$cursor" -- content/en glossaries; then
                base="$parent"
                break
              fi
              cursor="$parent"
            done
          fi

          echo "Resolved translation base: $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Refresh stale active translations
        env:
          TRANSLATION_BASE_SHA: ${{ steps.translation-base.outputs.sha }}
        run: python scripts/auto_translate.py

      - name: Repair translated raw HTML
        run: python scripts/repair_translated_html.py

      - name: Commit refreshed source and translations without retriggering CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/en translations; then
            echo "No source or translation files changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/en translations
          git commit -m "Auto-centralize bibliography and refresh translations [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Source and translations pushed successfully."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Unable to publish generated source/translations after 3 attempts because main kept changing." >&2
              exit 1
            fi

            echo "main advanced while publication files were being generated; resynchronizing with the latest main (attempt $((attempt + 1))/3)."
            git fetch origin main
            git reset --hard origin/main

            python scripts/centralize_bibliography.py
            TRANSLATION_BASE_SHA=0000000000000000000000000000000000000000 python scripts/auto_translate.py
            python scripts/repair_translated_html.py

            if git diff --quiet -- content/en translations; then
              echo "Latest main already contains current source and translations; no push is required."
              exit 0
            fi

            git add content/en translations
            git commit -m "Auto-centralize bibliography and refresh translations [skip ci]"
          done

      - name: Validate and build every configured language
        run: python scripts/multilingual_site.py --require-translations

      - name: Install Playwright Chromium and CJK fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra

      - name: Apply A5 publication profile
        run: python scripts/pdf_export/apply_a5_profile.py

      - name: Export current PDFs
        run: |
          python scripts/export_pdf_guides.py \
            --locales all \
            --placeholders hide \
            --output-dir release-assets/pdf

      - name: Package current downloadable editions
        run: |
          set -euo pipefail
          version_label="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().version_label)')"
          mkdir -p release-assets/packages/html release-assets/packages/markdown release-upload
          cp -R site/. release-assets/packages/html/
          cp -R .site-work/docs/. release-assets/packages/markdown/
          cp release-assets/pdf/*.pdf release-upload/
          (cd release-assets/packages/html && zip -qr "../../../release-upload/the-gongfu-of-xinzuo-${version_label}-html.zip" .)
          (cd release-assets/packages/markdown && zip -qr "../../../release-upload/the-gongfu-of-xinzuo-${version_label}-markdown.zip" .)
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - name: Publish immutable versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_label="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().version_label)')"
          publication_date="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().publication_date)')"
          tag="edition-${version_label}"
          title="The Gongfu of Xinzuo — ${version_label} — ${publication_date}"
          source_sha="$(git rev-parse HEAD)"
          notes="Automatically published from main on ${publication_date}. Source commit: ${source_sha}. This release is an archived edition; newer editions are published as separate releases."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag "$tag" "$source_sha"
            git push origin "refs/tags/${tag}"
          fi

          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; refreshing its assets idempotently."
            while IFS= read -r asset_id; do
              gh api --method DELETE "repos/${REPOSITORY}/releases/assets/${asset_id}"
            done < <(gh api "repos/${REPOSITORY}/releases/tags/${tag}" --jq '.assets[].id')
            gh release upload "$tag" release-upload/* --repo "$REPOSITORY"
            gh release edit "$tag" \
              --repo "$REPOSITORY" \
              --target "$source_sha" \
              --title "$title" \
              --notes "$notes" \
              --latest
          else
            gh release create "$tag" release-upload/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi

          if gh release view latest --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest \
              --repo "$REPOSITORY" \
              --title "Legacy rolling edition — archived" \
              --notes "Legacy rolling release retained for continuity. Starting with the versioned publication system, every new edition is stored as its own archived GitHub Release."
          fi

      - name: Verify downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_label="$(python -c 'from scripts.publication_metadata import get_metadata; print(get_metadata().version_label)')"
          tag="edition-${version_label}"
          asset_count="$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets | length')"
          if [ "$asset_count" -ne 6 ]; then
            echo "Expected exactly 6 downloadable assets, found $asset_count." >&2
            exit 1
          fi
          gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | sort > actual-assets.txt
          printf '%s\n' \
            "SHA256SUMS.txt" \
            "The-Gongfu-of-Xinzuo-EN-${version_label}.pdf" \
            "The-Gongfu-of-Xinzuo-IT-${version_label}.pdf" \
            "The-Gongfu-of-Xinzuo-ZH-HANS-${version_label}.pdf" \
            "the-gongfu-of-xinzuo-${version_label}-html.zip" \
            "the-gongfu-of-xinzuo-${version_label}-markdown.zip" | sort > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt

          latest_tag="$(gh api "repos/${REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [ "$latest_tag" != "$tag" ]; then
            echo "Expected GitHub's Latest release to be ${tag}, found ${latest_tag}." >&2
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-publish
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
