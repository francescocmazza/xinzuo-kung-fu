name: Protect The Gongfu of Xinzuo title

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/protect-gongfu-title.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Protect proper title and repair Chinese title references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          translator = Path("scripts/auto_translate.py")
          text = translator.read_text(encoding="utf-8")

          guard = '        if text.strip() == "The Gongfu of Xinzuo":\n            return text.strip()\n'
          if guard not in text:
              anchor = '        if not text.strip():\n            return text\n'
              if anchor not in text:
                  raise SystemExit("Could not locate _translate_plain guard anchor")
              text = text.replace(anchor, anchor + guard, 1)

          start_marker = '    def _translate_payload(self, payload: str) -> str:\n'
          end_marker = '\n    def translate_line(self, line: str) -> str:\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Could not locate _translate_payload function")
          new_payload = (
              '    def _translate_payload(self, payload: str) -> str:\n'
              '        linked, restore_links = self._protect_markdown_links(payload)\n'
              '        title_pattern = re.compile(r"(\\*{0,2}The Gongfu of Xinzuo\\*{0,2})")\n'
              '        parts = title_pattern.split(linked)\n'
              '        translated_parts: list[str] = []\n'
              '        for part in parts:\n'
              '            if not part:\n'
              '                continue\n'
              '            if title_pattern.fullmatch(part):\n'
              '                translated_parts.append(part)\n'
              '                continue\n'
              '            protected, restore_inline = _protect_inline(part)\n'
              '            translated_parts.append(restore_inline(self._translate_plain(protected)))\n'
              '        return restore_links("".join(translated_parts))\n'
          )
          text = text[:start] + new_payload + text[end:]
          translator.write_text(text, encoding="utf-8")

          zh = Path("translations/zh-Hans/index.md")
          zh_text = zh.read_text(encoding="utf-8")
          zh_text = zh_text.replace("# 清藏的功夫", "# The Gongfu of Xinzuo", 1)
          zh_text = zh_text.replace(
              "其宗旨是指导个人在知识和厨房刀的实际使用方面的成长。",
              "*The Gongfu of Xinzuo* 的宗旨是指导个人在知识和厨房刀的实际使用方面的成长。",
              1,
          )
          zh.write_text(zh_text, encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/auto_translate.py translations/zh-Hans/index.md
          git commit -m "Protect The Gongfu of Xinzuo in translations"
          git push origin HEAD:main
