name: Publish official release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag, for example v1.0.0"
        required: true
        type: string
      title:
        description: "Release title"
        required: true
        default: "The Gongfu of Xinzuo"
        type: string
      prerelease:
        description: "Publish as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: official-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and tag availability
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Version must use a semantic tag such as v1.0.0" >&2
            exit 1
          }
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-pdf.txt
            requirements-translation.txt

      - name: Install documentation and PDF dependencies
        run: pip install -r requirements-pdf.txt

      - name: Install Playwright Chromium and CJK fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-cjk-extra

      - name: Cache translation models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-marian-${{ runner.os }}-${{ hashFiles('requirements-translation.txt') }}
          restore-keys: |
            hf-marian-${{ runner.os }}-

      - name: Install local translation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -r requirements-translation.txt

      - name: Centralize bibliography in English source
        run: python scripts/centralize_bibliography.py

      - name: Refresh and validate active translations
        run: |
          python scripts/auto_translate.py
          python scripts/multilingual_site.py --require-translations

      - name: Apply A5 publication profile
        run: python scripts/pdf_export/apply_a5_profile.py

      - name: Export PDFs
        run: |
          python scripts/export_pdf_guides.py \
            --locales all \
            --placeholders hide \
            --output-dir release-assets/pdf

      - name: Package downloadable editions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/packages/html release-assets/packages/markdown release-upload
          cp -R site/. release-assets/packages/html/
          cp -R .site-work/docs/. release-assets/packages/markdown/
          cp release-assets/pdf/*.pdf release-upload/
          (cd release-assets/packages/html && zip -qr "../../../release-upload/the-gongfu-of-xinzuo-${VERSION}-html.zip" .)
          (cd release-assets/packages/markdown && zip -qr "../../../release-upload/the-gongfu-of-xinzuo-${VERSION}-markdown.zip" .)
          (cd release-upload && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            "$VERSION"
            release-upload/*
            --target main
            --title "$RELEASE_TITLE $VERSION"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
