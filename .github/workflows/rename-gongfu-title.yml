name: One-time rename to The Gongfu of Xinzuo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rename-gongfu-title.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Replace title forms outside workflow files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          replacements = [
              ("The Kung Fu of Xinzuo", "The Gongfu of Xinzuo"),
              ("Il Kung Fu di Xinzuo", "The Gongfu of Xinzuo"),
              ("Xinzuo 的功夫", "The Gongfu of Xinzuo"),
              ("Xinzuo的功夫", "The Gongfu of Xinzuo"),
              ("The-Kung-Fu-of-Xinzuo", "The-Gongfu-of-Xinzuo"),
              ("Il-Kung-Fu-di-Xinzuo", "The-Gongfu-of-Xinzuo"),
              ("Xinzuo-Kung-Fu", "The-Gongfu-of-Xinzuo"),
              ("Kung Fu", "Gongfu"),
              ("Kung fu", "Gongfu"),
              ("kung fu", "gongfu"),
          ]

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix().startswith(".github/workflows/"):
                  continue
              if not path.is_file():
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          translator = Path("scripts/auto_translate.py")
          translator_text = translator.read_text(encoding="utf-8")
          protection = '        re.compile(r"The Gongfu of Xinzuo"),\n'
          if protection not in translator_text:
              marker = '    patterns = [\n        re.compile(r"`[^`\\n]+`"),\n'
              if marker not in translator_text:
                  raise SystemExit("Could not locate translator protection marker")
              translator_text = translator_text.replace(
                  marker,
                  '    patterns = [\n        re.compile(r"The Gongfu of Xinzuo"),\n        re.compile(r"`[^`\\n]+`"),\n',
                  1,
              )
              translator.write_text(translator_text, encoding="utf-8")
              changed.append("scripts/auto_translate.py")

          print(f"Updated {len(changed)} tracked text files outside .github/workflows")
          for path in changed:
              print(path)
          PY

      - name: Validate migration
        shell: bash
        run: |
          python -m compileall -q scripts
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/*'
          if git diff --cached --quiet; then
            echo "No non-workflow changes remain."
            exit 0
          fi
          git commit -m "Rename book to The Gongfu of Xinzuo"
          git push origin HEAD:main
