name: Deploy Xinzuo Academy company backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.ACADEMY_D1_DATABASE_ID }}
      BOOTSTRAP_TOKEN: ${{ secrets.ACADEMY_BOOTSTRAP_TOKEN }}
      PASSWORD_PEPPER: ${{ secrets.ACADEMY_PASSWORD_PEPPER }}
      IP_HASH_SALT: ${{ secrets.ACADEMY_IP_HASH_SALT }}
      RESET_WEBHOOK_URL: ${{ secrets.ACADEMY_RESET_WEBHOOK_URL }}
      RESET_PAGE_URL: ${{ vars.ACADEMY_PUBLIC_URL }}
      ALLOWED_ORIGINS: ${{ vars.ACADEMY_ALLOWED_ORIGINS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID BOOTSTRAP_TOKEN PASSWORD_PEPPER IP_HASH_SALT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret/environment value: $name" >&2
              exit 1
            fi
          done

      - name: Install Wrangler
        working-directory: academy-backend
        run: npm install

      - name: Build deployment config
        working-directory: academy-backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          allowed = os.environ.get("ALLOWED_ORIGINS") or "https://francescocmazza.github.io"
          cfg = {
              "$schema": "node_modules/wrangler/config-schema.json",
              "name": "xinzuo-academy-api",
              "main": "src/worker.js",
              "compatibility_date": "2026-09-24",
              "d1_databases": [{
                  "binding": "DB",
                  "database_name": "xinzuo-academy",
                  "database_id": os.environ["D1_DATABASE_ID"],
                  "migrations_dir": "migrations",
              }],
              "vars": {
                  "ACTIVE_LESSON_TOTAL": "27",
                  "ALLOWED_ORIGINS": allowed,
                  "RESET_PAGE_URL": os.environ.get("RESET_PAGE_URL") or "https://francescocmazza.github.io/xinzuo-kung-fu/academy/",
              },
          }
          with open("wrangler.jsonc", "w", encoding="utf-8") as fh:
              json.dump(cfg, fh, indent=2)
          PY

      - name: Apply D1 migrations
        working-directory: academy-backend
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Configure Worker secrets
        working-directory: academy-backend
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BOOTSTRAP_TOKEN" | npx wrangler secret put BOOTSTRAP_TOKEN --config wrangler.jsonc
          printf '%s' "$PASSWORD_PEPPER" | npx wrangler secret put PASSWORD_PEPPER --config wrangler.jsonc
          printf '%s' "$IP_HASH_SALT" | npx wrangler secret put IP_HASH_SALT --config wrangler.jsonc
          if [ -n "${RESET_WEBHOOK_URL:-}" ]; then
            printf '%s' "$RESET_WEBHOOK_URL" | npx wrangler secret put RESET_WEBHOOK_URL --config wrangler.jsonc
          fi

      - name: Deploy Worker
        working-directory: academy-backend
        run: npx wrangler deploy --config wrangler.jsonc
