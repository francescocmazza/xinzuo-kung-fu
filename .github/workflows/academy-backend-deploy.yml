name: Deploy Xinzuo Academy public backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.ACADEMY_D1_DATABASE_ID }}
      BOOTSTRAP_TOKEN: ${{ secrets.ACADEMY_BOOTSTRAP_TOKEN }}
      PASSWORD_PEPPER: ${{ secrets.ACADEMY_PASSWORD_PEPPER }}
      IP_HASH_SALT: ${{ secrets.ACADEMY_IP_HASH_SALT }}
      VERIFICATION_PEPPER: ${{ secrets.ACADEMY_VERIFICATION_PEPPER }}
      VERIFICATION_WEBHOOK_URL: ${{ secrets.ACADEMY_VERIFICATION_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.ACADEMY_RESEND_API_KEY }}
      VERIFICATION_EMAIL_FROM: ${{ vars.ACADEMY_VERIFICATION_EMAIL_FROM }}
      TWILIO_ACCOUNT_SID: ${{ secrets.ACADEMY_TWILIO_ACCOUNT_SID }}
      TWILIO_API_KEY: ${{ secrets.ACADEMY_TWILIO_API_KEY }}
      TWILIO_API_SECRET: ${{ secrets.ACADEMY_TWILIO_API_SECRET }}
      TWILIO_FROM_NUMBER: ${{ secrets.ACADEMY_TWILIO_FROM_NUMBER }}
      TWILIO_MESSAGING_SERVICE_SID: ${{ secrets.ACADEMY_TWILIO_MESSAGING_SERVICE_SID }}
      TWILIO_API_BASE: ${{ vars.ACADEMY_TWILIO_API_BASE }}
      PUBLIC_REGISTRATION_ENABLED: ${{ vars.ACADEMY_PUBLIC_REGISTRATION_ENABLED }}
      RESET_PAGE_URL: ${{ vars.ACADEMY_PUBLIC_URL }}
      ALLOWED_ORIGINS: ${{ vars.ACADEMY_ALLOWED_ORIGINS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID BOOTSTRAP_TOKEN PASSWORD_PEPPER IP_HASH_SALT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret/environment value: $name" >&2
              exit 1
            fi
          done

      - name: Install Wrangler
        working-directory: academy-backend
        run: npm install

      - name: Build deployment config
        working-directory: academy-backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          allowed = os.environ.get("ALLOWED_ORIGINS") or "https://francescocmazza.github.io"
          cfg = {
              "$schema": "node_modules/wrangler/config-schema.json",
              "name": "xinzuo-academy-api",
              "main": "src/worker.js",
              "compatibility_date": "2026-09-24",
              "d1_databases": [{
                  "binding": "DB",
                  "database_name": "xinzuo-academy",
                  "database_id": os.environ["D1_DATABASE_ID"],
                  "migrations_dir": "migrations",
              }],
              "vars": {
                  "ACTIVE_LESSON_TOTAL": "27",
                  "ALLOWED_ORIGINS": allowed,
                  "RESET_PAGE_URL": os.environ.get("RESET_PAGE_URL") or "https://francescocmazza.github.io/xinzuo-kung-fu/academy/",
                  "VERIFICATION_EMAIL_FROM": os.environ.get("VERIFICATION_EMAIL_FROM") or "",
                  "TWILIO_API_BASE": os.environ.get("TWILIO_API_BASE") or "https://api.twilio.com/2010-04-01",
                  "PUBLIC_REGISTRATION_ENABLED": os.environ.get("PUBLIC_REGISTRATION_ENABLED") or "false",
              },
          }
          with open("wrangler.jsonc", "w", encoding="utf-8") as fh:
              json.dump(cfg, fh, indent=2)
          PY

      - name: Apply D1 migrations
        working-directory: academy-backend
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Configure Worker secrets
        working-directory: academy-backend
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BOOTSTRAP_TOKEN" | npx wrangler secret put BOOTSTRAP_TOKEN --config wrangler.jsonc
          printf '%s' "$PASSWORD_PEPPER" | npx wrangler secret put PASSWORD_PEPPER --config wrangler.jsonc
          printf '%s' "$IP_HASH_SALT" | npx wrangler secret put IP_HASH_SALT --config wrangler.jsonc
          if [ -n "${VERIFICATION_PEPPER:-}" ]; then
            printf '%s' "$VERIFICATION_PEPPER" | npx wrangler secret put VERIFICATION_PEPPER --config wrangler.jsonc
          fi
          if [ -n "${VERIFICATION_WEBHOOK_URL:-}" ]; then
            printf '%s' "$VERIFICATION_WEBHOOK_URL" | npx wrangler secret put VERIFICATION_WEBHOOK_URL --config wrangler.jsonc
          fi
          if [ -n "${RESEND_API_KEY:-}" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.jsonc
          fi
          if [ -n "${TWILIO_ACCOUNT_SID:-}" ]; then
            printf '%s' "$TWILIO_ACCOUNT_SID" | npx wrangler secret put TWILIO_ACCOUNT_SID --config wrangler.jsonc
          fi
          if [ -n "${TWILIO_API_KEY:-}" ]; then
            printf '%s' "$TWILIO_API_KEY" | npx wrangler secret put TWILIO_API_KEY --config wrangler.jsonc
          fi
          if [ -n "${TWILIO_API_SECRET:-}" ]; then
            printf '%s' "$TWILIO_API_SECRET" | npx wrangler secret put TWILIO_API_SECRET --config wrangler.jsonc
          fi
          if [ -n "${TWILIO_FROM_NUMBER:-}" ]; then
            printf '%s' "$TWILIO_FROM_NUMBER" | npx wrangler secret put TWILIO_FROM_NUMBER --config wrangler.jsonc
          fi
          if [ -n "${TWILIO_MESSAGING_SERVICE_SID:-}" ]; then
            printf '%s' "$TWILIO_MESSAGING_SERVICE_SID" | npx wrangler secret put TWILIO_MESSAGING_SERVICE_SID --config wrangler.jsonc
          fi

      - name: Deploy Worker
        working-directory: academy-backend
        run: npx wrangler deploy --config wrangler.jsonc
