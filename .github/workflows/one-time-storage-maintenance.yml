name: One-time storage maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-storage-maintenance.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Stop persisting rebuildable caches and shorten temporary artifact retention
        shell: python
        run: |
          from pathlib import Path

          pages = Path('.github/workflows/pages.yml')
          export = Path('.github/workflows/export-pdf.yml')

          pages_text = pages.read_text(encoding='utf-8')
          export_text = export.read_text(encoding='utf-8')

          setup_cache = '''          cache: pip
          cache-dependency-path: |
            requirements-pdf.txt
            requirements-translation.txt
'''
          pages_hf_cache = '''      - name: Cache local translation models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-marian-${{ runner.os }}-${{ hashFiles('requirements-translation.txt') }}
          restore-keys: |
            hf-marian-${{ runner.os }}-

'''
          export_hf_cache = '''      - name: Cache local translation models
        if: github.event_name == 'workflow_dispatch' && inputs.language != 'en'
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-marian-${{ runner.os }}-${{ hashFiles('requirements-translation.txt') }}
          restore-keys: |
            hf-marian-${{ runner.os }}-

'''

          for label, text, required in [
              ('pages setup-python cache', pages_text, setup_cache),
              ('pages HF cache', pages_text, pages_hf_cache),
              ('export setup-python cache', export_text, setup_cache),
              ('export HF cache', export_text, export_hf_cache),
          ]:
              if required not in text:
                  raise SystemExit(f'Expected block not found: {label}')

          pages_text = pages_text.replace(setup_cache, '', 1)
          pages_text = pages_text.replace(pages_hf_cache, '', 1)
          export_text = export_text.replace(setup_cache, '', 1)
          export_text = export_text.replace(export_hf_cache, '', 1)

          if 'retention-days: 3' not in export_text:
              raise SystemExit('Expected PDF artifact retention setting not found')
          export_text = export_text.replace('retention-days: 3', 'retention-days: 1', 1)

          pages.write_text(pages_text, encoding='utf-8')
          export.write_text(export_text, encoding='utf-8')

      - name: Commit workflow storage changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pages.yml .github/workflows/export-pdf.yml
          if git diff --cached --quiet; then
            echo "No workflow changes needed."
          else
            git commit -m "Reduce rebuildable Actions storage [skip ci]"
            git push origin HEAD:main
          fi

      - name: Delete obsolete Actions artifacts and all rebuildable caches
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const keepPatterns = [
              /^xinzuo-kung-fu-pdf-/,
              /^the-gongfu-of-xinzuo-multilingual-/
            ];
            const keep = new Set();
            for (const pattern of keepPatterns) {
              const newest = artifacts
                .filter(a => !a.expired && pattern.test(a.name))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
              if (newest) keep.add(newest.id);
            }

            let deletedArtifacts = 0;
            let artifactBytes = 0;
            for (const artifact of artifacts) {
              if (artifact.expired || keep.has(artifact.id)) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              deletedArtifacts++;
              artifactBytes += artifact.size_in_bytes;
            }

            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner, repo, per_page: 100 }
            );
            let deletedCaches = 0;
            let cacheBytes = 0;
            for (const cache of caches) {
              await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
              deletedCaches++;
              cacheBytes += cache.size_in_bytes;
            }

            const totalMiB = (artifactBytes + cacheBytes) / 1024 / 1024;
            console.log(`Deleted ${deletedArtifacts} artifacts (${(artifactBytes / 1024 / 1024).toFixed(1)} MiB).`);
            console.log(`Deleted ${deletedCaches} caches (${(cacheBytes / 1024 / 1024).toFixed(1)} MiB).`);
            console.log(`Freed ${totalMiB.toFixed(1)} MiB in this pass; kept ${keep.size} latest temporary PDF artifact(s).`);
