name: Prepare ChatGPT translation queue

on:
  pull_request:
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/locales.yml"
      - "scripts/chatgpt_translate.py"
      - "scripts/test_chatgpt_translate.py"
      - ".translation/results.json"
      - ".github/workflows/translation-status.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to inspect"
        required: true
        default: "main"
      locales:
        description: "Optional space-separated locale codes; blank means deployed non-English locales"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: translation-status-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  queue:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Run differential translation tests
        run: python scripts/test_chatgpt_translate.py

      - name: Apply ChatGPT result batch
        if: hashFiles('.translation/results.json') != ''
        run: python scripts/chatgpt_translate.py --apply-results .translation/results.json

      - name: Prepare translation queue
        env:
          TARGET_LOCALES: ${{ github.event_name == 'workflow_dispatch' && inputs.locales || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TARGET_LOCALES" ]; then
            read -r -a locale_args <<< "$TARGET_LOCALES"
            args+=(--locales "${locale_args[@]}")
          fi
          mkdir -p .translation
          python scripts/chatgpt_translate.py --prepare-queue .translation/queue.json "${args[@]}"

      - name: Commit applied translations and queue snapshot into the branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations .translation/queue.json
          git rm --ignore-unmatch .translation/results.json
          if git diff --cached --quiet; then
            echo "Queue snapshot already current."
            exit 0
          fi
          git commit -m "Apply ChatGPT translations and update queue [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload queue artifact
        uses: actions/upload-artifact@v6
        with:
          name: chatgpt-translation-queue-${{ github.run_number }}
          path: .translation/queue.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate committed translations
        run: python scripts/chatgpt_translate.py --check-only
