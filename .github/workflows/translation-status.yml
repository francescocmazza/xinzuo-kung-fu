name: Prepare ChatGPT translation queue

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/locales.yml"
      - "scripts/chatgpt_translate.py"
      - "scripts/test_chatgpt_translate.py"
      - "scripts/publication_locales.py"
      - ".translation/results.json"
      - ".translation/pages/**"
      - ".github/workflows/translation-status.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to inspect"
        required: true
        default: "main"
      locales:
        description: "Optional space-separated locale codes; blank means deployed non-English locales"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: translation-status-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  queue:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Run differential translation tests
        run: python scripts/test_chatgpt_translate.py

      - name: Apply full-page ChatGPT translation batch
        if: hashFiles('.translation/pages/**/*.md') != ''
        run: python scripts/chatgpt_translate.py --apply-page-dir .translation/pages

      - name: Apply ChatGPT result batch
        if: hashFiles('.translation/results.json') != ''
        run: python scripts/chatgpt_translate.py --apply-results .translation/results.json

      - name: Prepare translation queue
        env:
          TARGET_LOCALES: ${{ github.event_name == 'workflow_dispatch' && inputs.locales || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "$TARGET_LOCALES" ]; then
            read -r -a locale_args <<< "$TARGET_LOCALES"
            args+=(--locales "${locale_args[@]}")
          fi
          mkdir -p .translation
          python scripts/chatgpt_translate.py --prepare-queue .translation/queue.json "${args[@]}"

      - name: Commit applied translations and queue snapshot into the branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations .translation/queue.json
          git rm -r --ignore-unmatch .translation/pages
          git rm --ignore-unmatch .translation/results.json
          if git diff --cached --quiet; then
            echo "Queue snapshot already current."
            exit 0
          fi
          git commit -m "Apply ChatGPT translations and update queue [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload queue artifact
        uses: actions/upload-artifact@v6
        with:
          name: chatgpt-translation-queue-${{ github.run_number }}
          path: .translation/queue.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate publication-ready translations
        shell: bash
        run: |
          set -euo pipefail
          ready_locales="$(python scripts/publication_locales.py --format space)"
          non_english=""
          for locale in $ready_locales; do
            if [ "$locale" != "en" ]; then
              non_english="$non_english $locale"
            fi
          done
          if [ -n "${non_english// /}" ]; then
            python scripts/chatgpt_translate.py --check-only --locales $non_english
          fi
          python scripts/publication_locales.py --explain

      - name: Summarize pending translation queue
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path(".translation/queue.json").read_text(encoding="utf-8"))
          by_locale = {}
          for page in data.get("pages", []):
              item = by_locale.setdefault(page["locale"], {"pages": 0, "units": 0})
              item["pages"] += 1
              item["units"] += len(page.get("units", []))
          print("### Translation queue")
          print()
          if not by_locale:
              print("All default translation-target locales are current.")
          else:
              for locale, item in by_locale.items():
                  print(f"- **{locale}**: {item['pages']} page(s), {item['units']} unit(s) remaining")
          PY
