name: Export multilingual guide

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/export-multilingual.yml"
      - "content/en/**"
      - "translations/**"
      - "mkdocs.yml"
      - "scripts/auto_translate.py"
      - "scripts/repair_translated_html.py"
      - "scripts/centralize_bibliography.py"
      - "requirements-translation.txt"
      - "scripts/publish_multilingual.ps1"
      - "publish-guide.cmd"
      - "PUBLISHING_GUIDE.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: multilingual-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-helper:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/publish_multilingual.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Confirm publishing documentation exists
        shell: bash
        run: |
          test -f publish-guide.cmd
          test -f PUBLISHING_GUIDE.md
          test -f scripts/auto_translate.py
          test -f scripts/repair_translated_html.py
          test -f scripts/centralize_bibliography.py
          test -f requirements-translation.txt

  export:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-translation.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Cache local translation models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-marian-${{ runner.os }}-${{ hashFiles('requirements-translation.txt') }}
          restore-keys: |
            hf-marian-${{ runner.os }}-

      - name: Install local translation dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install -r requirements-translation.txt

      - name: Centralize bibliography in English source
        run: python scripts/centralize_bibliography.py

      - name: Resolve translation base revision
        id: translation-base
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD^1)"

          # If this commit changes no English source or glossary, it may be a
          # recovery/CI-only commit following a failed publication. Walk back to
          # the most recent source-changing commit and use that commit's parent,
          # so stale translations cannot be rehashed as current without actually
          # translating the missed source changes.
          if git diff --quiet "$base" HEAD -- content/en glossaries; then
            cursor="$base"
            for _ in $(seq 1 50); do
              parent="$(git rev-parse "${cursor}^1" 2>/dev/null || true)"
              if [ -z "$parent" ]; then
                break
              fi
              if ! git diff --quiet "$parent" "$cursor" -- content/en glossaries; then
                base="$parent"
                break
              fi
              cursor="$parent"
            done
          fi

          echo "Resolved translation base: $base"
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Refresh stale active translations locally
        env:
          TRANSLATION_BASE_SHA: ${{ steps.translation-base.outputs.sha }}
        run: python scripts/auto_translate.py

      - name: Repair translated raw HTML
        run: python scripts/repair_translated_html.py

      - name: Build every configured language from refreshed translations
        run: python scripts/multilingual_site.py --require-translations

      - name: Prepare export package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/html export/markdown
          cp -R site/. export/html/
          cp -R .site-work/docs/. export/markdown/
          cat > export/README.txt <<'EOF'
          The Gongfu of Xinzuo multilingual export

          html/      Complete built website for every configured active locale.
          markdown/  Per-locale source trees used to build the site.

          English remains the source of truth. Stale active translations are refreshed locally before export and may require human review.
          Bibliographic lists are centralized into the final Bibliography chapter before export.
          No translation API key or paid translation API is used.
          Image rights may differ from the written-content license; see the repository IMAGE_RIGHTS.md.
          EOF

      - name: Upload multilingual guide export
        uses: actions/upload-artifact@v6
        with:
          name: the-gongfu-of-xinzuo-multilingual-${{ github.run_number }}
          path: export
          if-no-files-found: error
          retention-days: 30
