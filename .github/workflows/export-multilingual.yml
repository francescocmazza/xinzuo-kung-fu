name: Export multilingual guide

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/export-multilingual.yml"
      - "content/en/**"
      - "translations/**"
      - "glossaries/**"
      - "localization/**"
      - "mkdocs.yml"
      - "scripts/chatgpt_translate.py"
      - "scripts/test_chatgpt_translate.py"
      - "scripts/centralize_bibliography.py"
      - "scripts/publication_locales.py"
      - "requirements-translation.txt"
      - "scripts/publish_multilingual.ps1"
      - "publish-guide.cmd"
      - "PUBLISHING_GUIDE.md"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: multilingual-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-helper:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/publish_multilingual.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Confirm publishing documentation exists
        shell: bash
        run: |
          test -f publish-guide.cmd
          test -f PUBLISHING_GUIDE.md
          test -f scripts/chatgpt_translate.py
          test -f scripts/test_chatgpt_translate.py
          test -f scripts/centralize_bibliography.py
          test -f scripts/publication_locales.py
          test -f requirements-translation.txt
          test -f glossaries/master-terms.yml

  export:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-translation.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Validate differential translation regression cases
        run: python scripts/test_chatgpt_translate.py
          python scripts/test_publication_locales.py

      - name: Centralize bibliography in English source
        run: python scripts/centralize_bibliography.py

      - name: Resolve publication-ready languages
        shell: bash
        run: |
          set -euo pipefail
          ready_locales="$(python scripts/publication_locales.py --format space)"
          echo "READY_LOCALES=$ready_locales" >> "$GITHUB_ENV"
          echo "Exporting ready locales: $ready_locales"
          python scripts/publication_locales.py --explain

      - name: Verify ready translations are current and ChatGPT-generated
        shell: bash
        run: |
          set -euo pipefail
          non_english=""
          for locale in $READY_LOCALES; do
            if [ "$locale" != "en" ]; then
              non_english="$non_english $locale"
            fi
          done
          if [ -n "${non_english// /}" ]; then
            python scripts/chatgpt_translate.py --check-only --locales $non_english
          fi

      - name: Build publication-ready languages from committed translations
        run: python scripts/multilingual_site.py --require-translations --locales $READY_LOCALES

      - name: Prepare export package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/html export/markdown
          cp -R site/. export/html/
          cp -R .site-work/docs/. export/markdown/
          cat > export/README.txt <<'EOF'
          The Gongfu of Xinzuo multilingual export

          html/      Complete built website for every configured active locale.
          markdown/  Per-locale source trees used to build the site.

          English remains the source of truth. Each non-English locale is included automatically only when its committed ChatGPT translation is complete and current.
          Bibliographic lists are centralized into the final Bibliography chapter before export.
          Export itself makes no translation API calls.
          Image rights may differ from the written-content license; see the repository IMAGE_RIGHTS.md.
          EOF

      - name: Upload multilingual guide export
        uses: actions/upload-artifact@v6
        with:
          name: the-gongfu-of-xinzuo-multilingual-${{ github.run_number }}
          path: export
          if-no-files-found: error
          retention-days: 30
