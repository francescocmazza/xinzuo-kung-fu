<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">The five dimensions of knife steel</title>
<desc id="desc">A five-axis comparison framework showing hardness, ease of sharpening, corrosion resistance, robustness and microstructural fineness. No steel values are plotted.</desc>
<style>text{font-family:Arial,sans-serif;fill:#222}.title{font-size:34px;font-weight:bold}.small{font-size:22px}.axis{font-size:24px;font-weight:bold}.grid{fill:none;stroke:#cbd5e1}.axisline{stroke:#94a3b8;stroke-width:2}</style>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="50" class="title">The five dimensions used in this book</text>
<g transform="translate(480,320)">
  <polygon class="grid" stroke-width="3" points="0,-170 162,-53 100,138 -100,138 -162,-53"/>
  <polygon class="grid" stroke-width="2" points="0,-128 122,-40 75,104 -75,104 -122,-40"/>
  <polygon class="grid" stroke-width="2" points="0,-85 81,-27 50,70 -50,70 -81,-27"/>
  <line class="axisline" x1="0" y1="0" x2="0" y2="-170"/>
  <line class="axisline" x1="0" y1="0" x2="162" y2="-53"/>
  <line class="axisline" x1="0" y1="0" x2="100" y2="138"/>
  <line class="axisline" x1="0" y1="0" x2="-100" y2="138"/>
  <line class="axisline" x1="0" y1="0" x2="-162" y2="-53"/>
  <circle cx="0" cy="0" r="5" fill="#64748b"/>
</g>
<text x="455" y="112" class="axis">Hardness</text>
<text x="675" y="265" class="axis">Ease of sharpening</text>
<text x="580" y="495" class="axis">Corrosion resistance</text>
<text x="220" y="495" class="axis">Robustness</text>
<text x="130" y="265" class="axis">Microstructural fineness</text>
<text x="40" y="585" class="small">Comparison framework only — plot values only when every axis is supported by a consistent test method.</text>
</svg>
