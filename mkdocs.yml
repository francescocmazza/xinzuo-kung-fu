site_name: The Kung Fu of Xinzuo
site_description: "A practical guide to kitchen knives: materials, shapes and techniques for masterful cutting, with examples from Xinzuo."
site_author: Francesco Claudio Mazza, EU Brand and Operations Manager at Xinzuo
site_url: https://francescocmazza.github.io/xinzuo-kung-fu/

repo_name: francescocmazza/xinzuo-kung-fu
repo_url: https://github.com/francescocmazza/xinzuo-kung-fu
edit_uri: edit/main/content/en/

copyright: Copyright &copy; 2026 Xinzuo - written content CC BY-NC-SA 4.0 unless otherwise stated

docs_dir: content/en
site_dir: site
use_directory_urls: true
exclude_docs: |
  README.md
  assets/IMAGE_RIGHTS.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view

plugins:
  - search

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true

extra_css:
  - assets/stylesheets/learning-figures.css
  - assets/stylesheets/visual-corrections.css

extra_javascript:
  - assets/javascripts/learning-figures.js
  - assets/javascripts/visual-corrections.js
  - assets/javascripts/knife-shape-layout.js

nav:
  - Preface: preface.md
  - The Kung Fu of Xinzuo: index.md
  - Knife Shapes and Their Uses: 05-knife-types/overview.md
  - Weight and Balance: 05-knife-types/weight-and-balance.md
  - Master the Movement:
      - Single and Double Bevels: 04-geometry-and-bevels/single-and-double-bevels.md
      - How to Cut - Essential Techniques: 06-cutting-techniques/essential-cutting-techniques.md
  - Understand the Material:
      - The Five Dimensions of Knife Steel: 01-foundations/five-dimensions-of-knife-steel.md
      - Alloying Elements: 02-steels-and-metallurgy/alloying-elements.md
      - Conventional and Powder-Metallurgy Steels: 02-steels-and-metallurgy/conventional-and-powder-metallurgy-steels.md
      - Xinzuo Blade Steels: 02-steels-and-metallurgy/xinzuo-blade-steels.md
      - Xinzuo Handle Materials: 02-steels-and-metallurgy/xinzuo-handle-materials.md
      - Damascus Steel: 03-blade-construction/damascus-steel.md
      - Self-Sharpening Full Damascus: 03-blade-construction/self-sharpening-full-damascus.md
  - Protect the Edge:
      - Safe Use and Carrying: 08-use-and-safety/safe-use-and-carrying.md
  - Restore the Edge:
      - Preparing Water Stones: 10-sharpening/whetstone-preparation.md
      - Understanding the Burr: 10-sharpening/the-burr.md
      - A Practical Sharpening Process: 10-sharpening/basic-sharpening-process.md
